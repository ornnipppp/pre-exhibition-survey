
<script>
// ตรวจสอบว่ามีอีเมลจากหน้า Login หรือไม่
const email = localStorage.getItem("exhibitionEmail");

// ถ้าไม่มีอีเมล ให้กลับไปหน้า Login
if (!email) {
  window.location.replace("./login.html");
}

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzO1Sr0blENOOak0A4Fssh4oCX2o25A0sn4gCNAUsB39xP9QM5Bo99cR8MwvzpShWnTYA/exec";

document.getElementById("pretest").addEventListener("submit", async function(e) {
  e.preventDefault();

  const required = [
    "gender", "age", "status",
    "q1", "q2", "q3", "q4", "q5",
    "q6", "q7", "q8", "q9", "q10"
  ];

  const complete = required.every(function(name) {
    return document.querySelector('input[name="' + name + '"]:checked');
  });

  if (!complete) {
    alert("กรุณาตอบคำถามให้ครบทุกข้อก่อนส่งแบบสอบถาม");
    return;
  }

  const savedEmail = localStorage.getItem("exhibitionEmail");

  if (!savedEmail) {
    alert("ไม่พบอีเมล กรุณาเข้าสู่ระบบใหม่");
    window.location.replace("./login.html");
    return;
  }

  const data = {
    formType: "pretest",
    email: savedEmail,
    submittedAt: new Date().toISOString()
  };

  required.forEach(function(name) {
    data[name] = document.querySelector(
      'input[name="' + name + '"]:checked'
    ).value;
  });

  const submitButton = document.querySelector(".submit");
  submitButton.disabled = true;
  submitButton.textContent = "SENDING...";

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    document.getElementById("result").style.display = "block";
    document.getElementById("result").scrollIntoView({
      behavior: "smooth"
    });

    submitButton.textContent = "THANK YOU ^-^";
  } catch (error) {
    console.error(error);
    alert("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
    submitButton.disabled = false;
    submitButton.textContent = "SUBMIT PRE-TEST";
  }
});
</script>
