<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGIN | Visualizing the Invisible</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:24px;
  display:flex;align-items:center;justify-content:center;
  background:#050505;color:white;
  font-family:Arial,sans-serif
}
main{
  width:100%;max-width:420px;
  padding:30px;border:1px solid #555;border-radius:12px;
  background:#101010
}
h1{color:#9ee9e9;font-size:30px}
p{line-height:1.8;color:#ccc}
label{display:block;margin:20px 0 8px}
input{
  width:100%;padding:14px;border-radius:6px;
  border:1px solid #777;background:#222;color:white;
  font-size:16px
}
button{
  width:100%;margin-top:20px;padding:15px;
  border:0;border-radius:6px;background:#eaffff;
  font-size:15px;font-weight:bold
}
#message{color:#9ee9e9;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>VISUALIZING THE INVISIBLE</h1>
<p>กรุณากรอกอีเมลเพื่อเริ่มทำแบบทดสอบก่อนเข้าชมนิทรรศการ</p>
<form id="loginForm">
<label for="email">อีเมล</label>
<input id="email" type="email" required
placeholder="example@email.com" autocomplete="email">
<button type="submit">CONTINUE</button>
</form>
<p id="message"></p>
</main>
<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  const email=document.getElementById("email").value.trim().toLowerCase();
  if(!email)return;
  localStorage.setItem("exhibitionEmail",email);
  window.location.href="./index.html";
});
</script>
</body>
</html>
